      <stop offset="1" stop-color="#0B0914"/>
    </radialGradient>
    <radialGradient id="nebula" cx=".78" cy=".45" r=".55">
      <stop offset="0" stop-color="#FFD9C2"/>
      <stop offset=".3" stop-color="#F08467"/>
      <stop offset=".65" stop-color="#B0459A"/>
      <stop offset="1" stop-color="#3A2E70"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- a round door ajar in a hill under the night sky; the coral light in the gap is the brightest thing in it -->
  <defs>
    <radialGradient id="sky" cx=".45" cy=".15" r=".9">
      <stop offset="0" stop-color="#2A2150"/>
      <stop offset="1" stop-color="#0B0914"/>
    </radialGradient>
    <radialGradient id="nebula" cx=".86" cy=".45" r=".5">
      <stop offset="0" stop-color="#FFE6D6"/>
      <stop offset=".35" stop-color="#FFA27F"/>
      <stop offset=".75" stop-color="#F08467"/>
      <stop offset="1" stop-color="#B0459A"/>
    </radialGradient>
    <clipPath id="tile"><rect width="32" height="32" rx="7"/></clipPath>
    <clipPath id="round"><circle cx="16" cy="18" r="10"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="url(#sky)"/>
    <circle cx="4.5" cy="4.5" r=".7" fill="#ECE8F7" opacity=".8"/>
    <circle cx="27.5" cy="3.5" r=".8" fill="#ECE8F7" opacity=".9"/>
    <path d="M-1 32V17C4 8 28 8 33 17V32Z" fill="#17122B"/>
  </g>
  <g clip-path="url(#round)">
    <rect x="6" y="8" width="20" height="20" fill="url(#nebula)"/>
    <ellipse cx="13.6" cy="18" rx="7.6" ry="10" fill="#1A1430"/>
  </g>
  <circle cx="13.6" cy="18" r="1.4" fill="#E4D0B4"/>
  <circle cx="16" cy="18" r="10.6" fill="none" stroke="#B497F3" stroke-width="2"/>
</svg>
